# Netlify: sito statico del gioco (apps/web). Il tool di revisione è solo locale.
[build]
  command = "pnpm --filter @eulero/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: ogni percorso sconosciuto torna all'index (i puzzle /puzzles/*.json sono file reali).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Il service worker e i file che cambiano a ogni deploy non devono restare in cache nel browser:
# così il controllo aggiornamenti vede subito i livelli nuovi. (Offline ci pensa il service worker.)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/puzzles/*"
  [headers.values]
    Cache-Control = "no-cache"
