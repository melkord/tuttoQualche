# Netlify: sito statico del gioco (apps/web). Il tool di revisione è solo locale.
[build]
  command = "pnpm --filter @tuttialcuni/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: ogni percorso sconosciuto torna all'index (i puzzle /puzzles/*.json sono file reali).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/puzzles/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
